# Project configuration.

defaults:
  - _self_
  # Hydra would otherwise install its own file handler; `packagename.log` owns
  # logging configuration instead, so there is a single owner.
  - override hydra/job_logging: disabled

project_name: packagename
random_seed: 42

# Parameters of the ETL stages. Anything that changes what a stage writes
# belongs here rather than as a literal in the code: a value in this versioned
# file is a value whose change shows up in `git log`. Stages are run by
# `packagename-stage`, which reads its parameters from this file alone.
etl:
  rows: 500 # observations synthesised by `generate_measurements`
  threshold: 0.5 # cutoff applied by `aggregate_measurements`

# Parameters of `packagename-data subsample`, which draws one small sample per
# region out of data/raw/ into data/sample/ and fingerprints every full dataset
# into data/manifest.yaml. The samples are committed to git, so the draw has to
# be reproducible: change `seed` and every committed sample is stale.
sample:
  rows: 1000 # observations drawn per region
  seed: 26 # seed of the draw

# Every key is spelled out, including the ones whose value is null. Hydra can
# only override a key that already exists in the composed config, so an omitted
# key is a key nobody can set from the command line without the `+` prefix.
wandb:
  project: packagename
  entity: null # your W&B user or team; null uses the account default
  # Offline by default so that a fresh clone runs with no credentials and no
  # network. Runs are still recorded locally; `wandb sync` uploads them later.
  # Switch to `online` once WANDB_API_KEY is in .env.
  mode: offline # online | offline | disabled
  group: null # collects related runs, e.g. the folds of one cross-validation
  job_type: null # this run's role within its group, e.g. train or eval
  tags: []
  save_code: true
  run_dir: null # where W&B writes locally; null means the repository root

logging:
  level: INFO
  file: null # e.g. "run.log" -> resolved under paths.logs
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  datefmt: "%H:%M:%S"
  quiet_loggers: [matplotlib, urllib3, botocore, fsspec]

# Every path below is made absolute at load time by anchoring it to `root`.
# `root: null` means "the repository root", derived from the package location,
# so nothing here depends on the working directory.
paths:
  root: null
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  sample: data/sample
  models: models
  # Tables and rankings the notebooks produce, as opposed to the figures below.
  # Keeping them apart is what lets `reports/figures` stay purely graphical.
  reports: reports
  figures: reports/figures
  logs: logs

hydra:
  job:
    # Default since Hydra 1.3, stated explicitly because the whole path design
    # depends on it: the process never changes directory.
    chdir: false
  run:
    # `project_root` is registered by packagename.cli._hydra, so Hydra's output
    # directories are absolute too and do not depend on where you launched from.
    dir: ${project_root:}/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${project_root:}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
