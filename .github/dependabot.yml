version: 2

# Workflows pin actions to a commit SHA, which is the only reference an attacker
# who takes over a tag cannot repoint. The cost is that pins do not pick up
# security fixes on their own, so Dependabot moves them in reviewable PRs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      # `build` is the conventional type for build and CI components; see
      # git-conventional-commits.yaml, which the commit-msg hook enforces.
      prefix: build

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      # One PR for the dev tools: they move often and are reviewed together.
      dev-tools:
        dependency-type: development
